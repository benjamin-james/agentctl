name: Release

# Builds agentctl for linux-x86_64 and linux-aarch64 on every push to main,
# then publishes a rolling "latest" prerelease with the binaries and a
# CHECKSUMS file.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            arch: x86_64
          - goarch: arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o agentctl-linux-${{ matrix.arch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: agentctl-linux-${{ matrix.arch }}
          path: agentctl-linux-${{ matrix.arch }}
          retention-days: 1

  release:
    name: Publish rolling release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build CHECKSUMS
        run: |
          cd artifacts
          sha256sum agentctl-linux-* > ../CHECKSUMS
          echo "=== CHECKSUMS ==="
          cat ../CHECKSUMS

      - name: Delete previous rolling release
        run: |
          gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (main)
          body: |
            Rolling build from `${{ github.sha }}` on `${{ github.ref_name }}`.

            ## Binaries

            | File | Arch |
            |------|------|
            | `agentctl-linux-x86_64` | x86_64 |
            | `agentctl-linux-aarch64` | aarch64 |
          prerelease: true
          files: |
            artifacts/agentctl-linux-x86_64
            artifacts/agentctl-linux-aarch64
            CHECKSUMS
