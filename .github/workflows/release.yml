name: Release

# Builds agentctl for linux-x86_64 and linux-aarch64 on every push to main,
# then publishes a semver prerelease (v0.1.N) with tarballs and a CHECKSUMS
# file. The patch number auto-increments by scanning existing git tags.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            arch: x86_64
          - goarch: arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o agentctl .
          tar -czf agentctl-linux-${{ matrix.arch }}.tar.gz agentctl

      - uses: actions/upload-artifact@v4
        with:
          name: agentctl-linux-${{ matrix.arch }}
          path: agentctl-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1

  release:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build CHECKSUMS
        run: |
          cd artifacts
          sha256sum agentctl-linux-*.tar.gz > ../CHECKSUMS
          echo "=== CHECKSUMS ==="
          cat ../CHECKSUMS

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all tags, find the highest vMAJOR.MINOR.PATCH, increment patch.
          # If no tags exist, start at v0.1.0.
          latest=$(gh api repos/${{ github.repository }}/tags \
            --paginate \
            --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1 \
            || true)
          if [ -z "$latest" ]; then
            version="v0.1.0"
          else
            major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
            minor=$(echo "$latest" | cut -d. -f2)
            patch=$(echo "$latest" | cut -d. -f3)
            patch=$((patch + 1))
            version="v${major}.${minor}.${patch}"
          fi
          echo "Latest tag: ${latest:-none}"
          echo "Next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Build ${{ steps.version.outputs.version }}
          body: |
            Build from `${{ github.sha }}` on `${{ github.ref_name }}`.

            ## Tarballs

            | File | Arch |
            |------|------|
            | `agentctl-linux-x86_64.tar.gz` | x86_64 |
            | `agentctl-linux-aarch64.tar.gz` | aarch64 |
          prerelease: true
          files: |
            artifacts/agentctl-linux-x86_64.tar.gz
            artifacts/agentctl-linux-aarch64.tar.gz
            CHECKSUMS
